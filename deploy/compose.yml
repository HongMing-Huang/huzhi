# 乎知一键服务器部署（国内云服务器 · IP 直访，无需备案域名）
#
# 适配：阿里云/腾讯云「轻量应用服务器」，选 Ubuntu 22.04+ 或自带 Docker 的应用模板。
# 安全组/防火墙放行 80 端口（TCP）。
#
# 在服务器上执行（共 4 步）：
#   1. bash <(curl -fsSL https://get.docker.com)                 # 装 Docker（已有可跳过）
#   2. git clone https://github.com/HongMing-Huang/huzhi.git && cd huzhi/deploy
#   3. cp .env.server.example .env.server && vi .env.server      # 填入知乎与 LLM 凭据
#   4. docker compose up -d --build
#
# 验证：浏览器打开 http://<服务器IP>/ → 注册 → 重启服务器容器 → 重新登录成功。
# 升级：cd huzhi && git pull && cd deploy && docker compose up -d --build
services:
  huzhi:
    build: ../web
    image: huzhi-web:local
    container_name: huzhi
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      # 数据库（内嵌文件库）落盘：重建容器数据不丢
      - huzhi-data:/app/.data
    env_file:
      - .env.server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/feed"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  huzhi-data:
